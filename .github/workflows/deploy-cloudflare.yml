name: Deploy Songbook Platform to Cloudflare Workers

on:
  push:
    branches: ["main"]
    paths:
      - "platform/**"
      - "data/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Cloudflare Worker
        shell: bash
        run: |

          restore_lockfiles() {
            if [[ -f yarn.lock.cloudflare-backup ]]; then mv yarn.lock.cloudflare-backup yarn.lock; fi
            if [[ -f bun.lock.cloudflare-backup ]]; then mv bun.lock.cloudflare-backup bun.lock; fi
          }
          trap restore_lockfiles EXIT
          if [[ -f yarn.lock ]]; then mv yarn.lock yarn.lock.cloudflare-backup; fi
          if [[ -f bun.lock ]]; then mv bun.lock bun.lock.cloudflare-backup; fi
          npx opennextjs-cloudflare build
        working-directory: platform

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: platform